name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      display: ${{ steps.version.outputs.display }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Resolve version
        id: version
        run: |
          tag="v0.0.1"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::Tag $tag must be vMAJOR.MINOR.PATCH with MINOR and PATCH below 100"
            exit 1
          fi
          code=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
          if [ "$code" -lt 1 ]; then
            echo "::error::Version code must be positive"
            exit 1
          fi
          echo "display=${tag:1}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.version.outputs.display }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Move temporary files to disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install workloads
        run: dotnet workload restore src/FixFlow.Mobile/FixFlow.Mobile.csproj

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fixflow.keystore"

      - name: Publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DemoTechnicianEmail: ${{ secrets.DEMO_TECHNICIAN_EMAIL }}
          DemoTechnicianPassword: ${{ secrets.DEMO_TECHNICIAN_PASSWORD }}
        run: >-
          dotnet publish src/FixFlow.Mobile
          --configuration Release
          --framework net10.0-android
          --output "$RUNNER_TEMP/android"
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/fixflow.keystore"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -p:ApplicationDisplayVersion="$VERSION"
          -p:ApplicationVersion="$VERSION_CODE"

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --verbose "$RUNNER_TEMP/android/io.github.mpalusgit.fixflow-Signed.apk"
          cp "$RUNNER_TEMP/android/io.github.mpalusgit.fixflow-Signed.apk" "FixFlow-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: FixFlow-${{ env.VERSION }}.apk
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.display }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET to a user directory
        run: echo "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload install maui-windows

      - name: Publish
        env:
          DemoTechnicianEmail: ${{ secrets.DEMO_TECHNICIAN_EMAIL }}
          DemoTechnicianPassword: ${{ secrets.DEMO_TECHNICIAN_PASSWORD }}
        run: >-
          dotnet publish src/FixFlow.Mobile
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --runtime win-x64
          --output "$env:RUNNER_TEMP\windows"
          -p:FixFlowPlatform=windows
          "-p:ApplicationDisplayVersion=$env:VERSION"
          "-p:ApplicationVersion=$env:VERSION_CODE"

      - name: Package
        run: Compress-Archive -Path "$env:RUNNER_TEMP\windows\*" -DestinationPath "FixFlow-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: FixFlow-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [version, android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.display }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "FixFlow $VERSION"
          --notes ""
