name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Build
        run: |
          dotnet build tests/FixFlow.Mobile.UnitTests --configuration Release
          dotnet build tests/FixFlow.Tools.Tests --configuration Release

      - name: Test
        run: |
          dotnet test --project tests/FixFlow.Mobile.UnitTests --no-build --configuration Release
          dotnet test --project tests/FixFlow.Tools.Tests --no-build --configuration Release

  check-comments:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Check comments
        run: dotnet run --project tools/FixFlow.Tools --configuration Release -- check-comments .

  build-android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Move temporary files to disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release --framework net10.0-android

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release --framework net10.0-windows10.0.19041.0
