name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Build
        run: |
          dotnet build tests/FixFlow.Mobile.UnitTests --configuration Release
          dotnet build tests/FixFlow.Tools.Tests --configuration Release

      - name: Test
        run: |
          dotnet test --project tests/FixFlow.Mobile.UnitTests --no-build --configuration Release
          dotnet test --project tests/FixFlow.Tools.Tests --no-build --configuration Release

  check-comments:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Check comments
        run: dotnet run --project tools/FixFlow.Tools --configuration Release -- check-comments .

  api-client:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Regenerate API client
        run: ./scripts/generate-api-client.sh

      - name: Compare with committed client
        run: git diff --exit-code -- src/FixFlow.Mobile.Core/Api/FixFlowApi.g.cs

  contract-drift:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare contract with FixFlow.Api main
        run: |
          if ! curl -fsSL https://raw.githubusercontent.com/mpalus-git/FixFlow.Api/main/openapi/v1.json -o "$RUNNER_TEMP/v1.json"; then
            echo "::warning::Could not download the FixFlow.Api contract"
            exit 0
          fi
          if ! cmp -s "$RUNNER_TEMP/v1.json" openapi/fixflow-api.v1.json; then
            echo "::warning::openapi/fixflow-api.v1.json differs from FixFlow.Api main. Run scripts/sync-api-contract.sh and scripts/generate-api-client.sh."
          fi

  build-android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Move temporary files to disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install workloads
        run: dotnet workload restore src/FixFlow.Mobile/FixFlow.Mobile.csproj

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release --framework net10.0-android

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET to a user directory
        run: echo "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-windows-

      - name: Install workloads
        run: dotnet workload restore src/FixFlow.Mobile/FixFlow.Mobile.csproj

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release --framework net10.0-windows10.0.19041.0
