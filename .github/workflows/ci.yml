name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Build
        run: |
          dotnet build tests/FixFlow.Mobile.UnitTests --configuration Release
          dotnet build tests/FixFlow.Tools.Tests --configuration Release

      - name: Test
        run: |
          dotnet test --project tests/FixFlow.Mobile.UnitTests --no-build --configuration Release --coverage --coverage-output-format cobertura --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage
          dotnet test --project tests/FixFlow.Tools.Tests --no-build --configuration Release

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: TestResults/coverage/*.cobertura.xml
          if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Build
        run: dotnet build tests/FixFlow.Mobile.IntegrationTests --configuration Release

      - name: Test
        run: dotnet test --project tests/FixFlow.Mobile.IntegrationTests --no-build --configuration Release --coverage --coverage-output-format cobertura --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: TestResults/coverage/*.cobertura.xml
          if-no-files-found: error

  coverage:
    needs: [build-and-test, integration-tests]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: TestResults/coverage

      - name: Coverage summary
        run: python3 .github/scripts/coverage_summary.py TestResults/coverage >> "$GITHUB_STEP_SUMMARY"

  check-comments:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Check comments
        run: dotnet run --project tools/FixFlow.Tools --configuration Release -- check-comments .

  api-client:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workload set
        run: dotnet workload update

      - name: Regenerate API client
        run: ./scripts/generate-api-client.sh

      - name: Compare with committed client
        run: git diff --exit-code -- src/FixFlow.Mobile.Core/Api/FixFlowApi.g.cs

  contract-drift:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare contract with FixFlow.Api main
        run: |
          if ! curl -fsSL https://raw.githubusercontent.com/mpalus-git/FixFlow.Api/main/openapi/v1.json -o "$RUNNER_TEMP/v1.json"; then
            echo "::warning::Could not download the FixFlow.Api contract"
            exit 0
          fi
          if ! cmp -s "$RUNNER_TEMP/v1.json" openapi/fixflow-api.v1.json; then
            echo "::warning::openapi/fixflow-api.v1.json differs from FixFlow.Api main. Run scripts/sync-api-contract.sh and scripts/generate-api-client.sh."
          fi

  build-android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Move temporary files to disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install workloads
        run: dotnet workload restore src/FixFlow.Mobile/FixFlow.Mobile.csproj

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release --framework net10.0-android -p:CiCheckBuild=true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET to a user directory
        run: echo "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build src/FixFlow.Mobile --configuration Release -p:FixFlowPlatform=windows
